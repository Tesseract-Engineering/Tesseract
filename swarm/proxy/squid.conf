# The only route from the pipelines to the internet. Mirrors the VPC rule:
# egress to the source APIs and the model endpoint, nothing else.
# (docs/SWARM.md, "Local development setup")

http_port 3128

acl allowlist dstdomain api.github.com .atlassian.net slack.com www.googleapis.com oauth2.googleapis.com api.anthropic.com
acl SSL_ports port 443
acl CONNECT method CONNECT

# TLS only: pipelines tunnel HTTPS through CONNECT, and plain HTTP is refused.
http_access deny !SSL_ports
http_access deny CONNECT !SSL_ports
http_access allow CONNECT allowlist
http_access deny all

# A pass-through, never a cache: nothing the pipelines fetch is kept here.
cache deny all
cache_mem 0 MB
coredump_dir /var/spool/squid

# Hosts and verdicts only; request bodies never reach these logs.
logformat swarm %ts.%03tu %>a %Ss/%03>Hs %rm %ru
access_log stdio:/var/log/squid/access.log swarm
