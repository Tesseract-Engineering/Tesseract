# The swarm's local dev stack (docs/SWARM.md, "Local development setup").
#
#   docker compose -f swarm/compose.yaml up -d storage proxy   always-on services
#   docker compose -f swarm/compose.yaml run --rm init         create the bucket, once
#   docker compose -f swarm/compose.yaml run --rm sample       one sample run
#
# Two networks enforce the VPC rule: pipelines sit only on `internal`, which
# has no route out, so the proxy's allowlist is their only way to the
# internet.
#
# The staging bucket is RustFS, an S3-compatible server: the MinIO image is
# no longer published on Docker Hub. Pipelines speak plain S3, so swapping it
# changes nothing above this file.

name: swarm

x-pipeline: &pipeline
  env_file:
    - path: ../.env
      required: false
  environment: &pipeline-env
    HTTPS_PROXY: http://proxy:3128
    HTTP_PROXY: http://proxy:3128
    NO_PROXY: storage
    S3_ENDPOINT: http://storage:9000
    S3_BUCKET: ${S3_BUCKET:-staging}
    AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-swarm-dev}
    AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:-swarm-dev-secret}
  networks: [internal]
  profiles: [jobs]
  depends_on:
    storage:
      condition: service_healthy
    proxy:
      condition: service_started

services:
  storage:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-swarm-dev}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:-swarm-dev-secret}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["../storage-data:/data"]
    # `host` exists only so the ports above reach the laptop: Docker publishes
    # nothing for a container that is on internal networks alone.
    networks: [internal, host]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/health"]
      interval: 3s
      timeout: 3s
      retries: 20

  proxy:
    image: ubuntu/squid:6.6-24.04_edge
    volumes: ["./proxy/squid.conf:/etc/squid/squid.conf:ro"]
    networks: [internal, egress]

  init:
    <<: *pipeline
    build: {context: .., dockerfile: pipelines/sample/Dockerfile}
    image: swarm-sample:dev
    command: ["init"]

  sample:
    <<: *pipeline
    build: {context: .., dockerfile: pipelines/sample/Dockerfile}
    image: swarm-sample:dev

  github:
    <<: *pipeline
    build: {context: .., dockerfile: pipelines/github/Dockerfile}
    image: swarm-github:dev
    environment:
      <<: *pipeline-env
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github/app.pem
    # The App's private key lives in data/github/app.pem: git-ignored, read-only here.
    volumes: ["../data/github:/run/secrets/github:ro"]

  # Nightly: `run --rm slack`. Cold start from an export unpacked (or its
  # .zip placed) in data/slack-export: `run --rm slack --export /data/slack-export`.
  slack:
    <<: *pipeline
    build: {context: .., dockerfile: pipelines/slack/Dockerfile}
    image: swarm-slack:dev
    volumes: ["../data/slack-export:/data/slack-export:ro"]

  drive:
    <<: *pipeline
    build: {context: .., dockerfile: pipelines/drive/Dockerfile}
    image: swarm-drive:dev
    environment:
      <<: *pipeline-env
      GDRIVE_SERVICE_ACCOUNT_KEY_PATH: /run/secrets/gdrive/service-account.json
    # The service account's JSON key lives in data/gdrive/: git-ignored, read-only here.
    volumes: ["../data/gdrive:/run/secrets/gdrive:ro"]

  # Run after github (its links resolve through GitHub's state) and before
  # slack and drive (their Jira keys resolve through this one's).
  jira:
    <<: *pipeline
    build: {context: .., dockerfile: pipelines/jira/Dockerfile}
    image: swarm-jira:dev

  # After the source runs: reads what they wrote, writes identity records.
  identity:
    <<: *pipeline
    build: {context: .., dockerfile: pipelines/identity/Dockerfile}
    image: swarm-identity:dev

networks:
  internal:
    internal: true
  egress: {}
  host: {}
