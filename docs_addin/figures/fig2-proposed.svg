<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="540" viewBox="0 0 1160 540"><rect width="100%" height="100%" fill="#fff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker><marker id="ah-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#5f6368"/></marker></defs><text x="30" y="36" font-family="Google Sans, Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#202124" font-weight="600" text-anchor="start">Proposed</text><text x="30" y="58" font-family="Google Sans, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#5f6368" font-weight="400" text-anchor="start">billing-service verifies tokens itself and reads the claims; the shim is removed</text><rect x="30" y="130" width="190" height="100" rx="10" fill="#fff" stroke="#dadce0" stroke-width="1.5"/><text x="125.0" y="156" font-family="Google Sans, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#202124" font-weight="600" text-anchor="middle">Webhook senders</text><text x="125.0" y="178" font-family="Google Sans, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f6368" font-weight="400" text-anchor="middle">bearer ID token</text><rect x="340" y="130" width="170" height="100" rx="10" fill="#fff" stroke="#dadce0" stroke-width="1.5"/><text x="425.0" y="156" font-family="Google Sans, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#202124" font-weight="600" text-anchor="middle">api-gateway</text><text x="425.0" y="178" font-family="Google Sans, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f6368" font-weight="400" text-anchor="middle">routes /webhooks/*</text><rect x="580" y="90" width="400" height="250" rx="12" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><text x="600" y="116" font-family="Google Sans, Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#1a73e8" font-weight="600" text-anchor="start">billing-service</text><rect x="605" y="135" width="170" height="88" rx="8" fill="#fff" stroke="#dadce0" stroke-width="1.5"/><text x="690.0" y="161" font-family="Google Sans, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#202124" font-weight="600" text-anchor="middle">Token verifier</text><text x="690.0" y="183" font-family="Google Sans, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f6368" font-weight="400" text-anchor="middle">signature, iss, aud, exp</text><text x="690.0" y="202" font-family="Google Sans, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f6368" font-weight="400" text-anchor="middle">JWKS in memory</text><rect x="790" y="135" width="170" height="88" rx="8" fill="#fff" stroke="#dadce0" stroke-width="1.5"/><text x="875.0" y="161" font-family="Google Sans, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#202124" font-weight="600" text-anchor="middle">Webhook handler</text><text x="875.0" y="183" font-family="Google Sans, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f6368" font-weight="400" text-anchor="middle">tenant_id, roles</text><text x="875.0" y="202" font-family="Google Sans, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f6368" font-weight="400" text-anchor="middle">from the token</text><rect x="605" y="238" width="355" height="82" rx="8" fill="#fff" stroke="#dadce0" stroke-width="1.5"/><text x="782.5" y="264" font-family="Google Sans, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#202124" font-weight="600" text-anchor="middle">Tenant client</text><text x="782.5" y="286" font-family="Google Sans, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f6368" font-weight="400" text-anchor="middle">plan and account details per webhook</text><text x="782.5" y="305" font-family="Google Sans, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f6368" font-weight="400" text-anchor="middle">token from /oauth/token, refreshed hourly</text><line x1="220" y1="180" x2="340" y2="180" stroke="#5f6368" stroke-width="1.6" marker-end="url(#ah)"/><text x="280.0" y="172.0" font-family="Google Sans, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#5f6368" font-weight="400" text-anchor="middle">POST /webhooks</text><line x1="510" y1="180" x2="605" y2="180" stroke="#5f6368" stroke-width="1.6" marker-end="url(#ah)"/><line x1="775" y1="179" x2="790" y2="179" stroke="#5f6368" stroke-width="1.6" marker-end="url(#ah)"/><rect x="1020" y="150" width="125" height="90" rx="10" fill="#f8f9fa" stroke="#dadce0" stroke-width="1.5"/><text x="1082.5" y="176" font-family="Google Sans, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#202124" font-weight="600" text-anchor="middle">Queue</text><text x="1082.5" y="198" font-family="Google Sans, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f6368" font-weight="400" text-anchor="middle">billing events</text><line x1="960" y1="179" x2="1020" y2="192" stroke="#5f6368" stroke-width="1.6" marker-end="url(#ah)"/><rect x="580" y="420" width="400" height="90" rx="10" fill="#fff" stroke="#dadce0" stroke-width="1.5"/><text x="780.0" y="446" font-family="Google Sans, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#202124" font-weight="600" text-anchor="middle">auth-service</text><text x="780.0" y="468" font-family="Google Sans, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f6368" font-weight="400" text-anchor="middle">/.well-known/jwks.json, /oauth/token,</text><text x="780.0" y="487" font-family="Google Sans, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f6368" font-weight="400" text-anchor="middle">tenant lookup API (no billing shim)</text><line x1="660" y1="420" x2="660" y2="223" stroke="#5f6368" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="545.0" y="366.5" font-family="Google Sans, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#5f6368" font-weight="400" text-anchor="middle">JWKS once at startup (direct)</text><line x1="880" y1="320" x2="880" y2="420" stroke="#5f6368" stroke-width="1.6" marker-end="url(#ah)" marker-start="url(#ah-start)"/><text x="932.0" y="370.0" font-family="Google Sans, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#5f6368" font-weight="400" text-anchor="middle">tenant lookup</text><path d="M580,465 L125,465 L125,238" fill="none" stroke="#5f6368" stroke-width="1.6" marker-end="url(#ah)"/><text x="350" y="457" font-family="Google Sans, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#5f6368" font-weight="400" text-anchor="middle">issues ID tokens</text></svg>