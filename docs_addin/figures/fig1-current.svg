<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="450" viewBox="0 0 1160 450"><rect width="100%" height="100%" fill="#fff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker><marker id="ah-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#5f6368"/></marker></defs><text x="30" y="36" font-family="Google Sans, Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#202124" font-weight="600" text-anchor="start">Today</text><text x="30" y="58" font-family="Google Sans, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#5f6368" font-weight="400" text-anchor="start">auth-service rewrites the namespaced claim back to tenant_id for the billing audience</text><rect x="30" y="120" width="210" height="110" rx="10" fill="#fff" stroke="#dadce0" stroke-width="1.5"/><text x="135.0" y="146" font-family="Google Sans, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#202124" font-weight="600" text-anchor="middle">Webhook senders</text><text x="135.0" y="168" font-family="Google Sans, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f6368" font-weight="400" text-anchor="middle">internal services, partners</text><text x="135.0" y="187" font-family="Google Sans, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f6368" font-weight="400" text-anchor="middle">bearer token, aud=billing</text><rect x="370" y="120" width="180" height="110" rx="10" fill="#fff" stroke="#dadce0" stroke-width="1.5"/><text x="460.0" y="146" font-family="Google Sans, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#202124" font-weight="600" text-anchor="middle">api-gateway</text><text x="460.0" y="168" font-family="Google Sans, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f6368" font-weight="400" text-anchor="middle">routes /webhooks/*</text><rect x="680" y="110" width="250" height="130" rx="10" fill="#fff" stroke="#dadce0" stroke-width="1.5"/><text x="805.0" y="136" font-family="Google Sans, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#202124" font-weight="600" text-anchor="middle">billing-service</text><text x="805.0" y="158" font-family="Google Sans, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f6368" font-weight="400" text-anchor="middle">webhook handler</text><text x="805.0" y="177" font-family="Google Sans, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f6368" font-weight="400" text-anchor="middle">reads top-level tenant_id</text><text x="805.0" y="196" font-family="Google Sans, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f6368" font-weight="400" text-anchor="middle">and roles from the token</text><rect x="1000" y="120" width="140" height="110" rx="10" fill="#f8f9fa" stroke="#dadce0" stroke-width="1.5"/><text x="1070.0" y="146" font-family="Google Sans, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#202124" font-weight="600" text-anchor="middle">Queue</text><text x="1070.0" y="168" font-family="Google Sans, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5f6368" font-weight="400" text-anchor="middle">billing events</text><line x1="240" y1="175" x2="370" y2="175" stroke="#5f6368" stroke-width="1.6" marker-end="url(#ah)"/><text x="305.0" y="167.0" font-family="Google Sans, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#5f6368" font-weight="400" text-anchor="middle">POST /webhooks</text><line x1="550" y1="175" x2="680" y2="175" stroke="#5f6368" stroke-width="1.6" marker-end="url(#ah)"/><line x1="930" y1="175" x2="1000" y2="175" stroke="#5f6368" stroke-width="1.6" marker-end="url(#ah)"/><rect x="370" y="300" width="560" height="120" rx="10" fill="#fff" stroke="#dadce0" stroke-width="1.5"/><text x="392" y="330" font-family="Google Sans, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill=