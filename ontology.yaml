# The swarm's closed vocabulary (docs/SWARM.md, "Ontology").
#
# Extractors may emit only these types; anything else goes in `attributes`.
# Both the extraction prompts and the record validator (swarm/ontology.py) load
# this file, so adding a type is an edit here plus a version bump agreed with
# the graph engineer.
#
# origin: deterministic  - written on item records (people, refs) by plain code
#         llm            - written on extraction records by the LLM step
#         both           - either
#
# `item_backed` entity types exist one per item or container. The LLM never
# produces them, which keeps the graph's skeleton exact.
#
# Every relation names the entity types it may start and end at (`from`, `to`).
# The validator refuses a ref or an extracted relation outside them.

version: 1

entities:
  person:        {origin: deterministic, description: "Authors, assignees, reviewers, mentions"}
  repo:          {origin: deterministic, item_backed: true}
  commit:        {origin: deterministic, item_backed: true}
  pull_request:  {origin: deterministic, item_backed: true}
  issue:         {origin: deterministic, item_backed: true}
  thread:        {origin: deterministic, item_backed: true}
  channel:       {origin: deterministic, item_backed: true}
  document:      {origin: deterministic, item_backed: true}
  folder:        {origin: deterministic, item_backed: true}
  team:          {origin: both, description: "LLM, plus Slack user groups and Google groups when present"}
  project:       {origin: both, description: "LLM, plus Jira epics"}
  decision:      {origin: llm}
  system:        {origin: llm, description: "A service, component or tool being discussed"}
  action_item:   {origin: llm}
  customer:      {origin: llm, description: "An external account named in tickets or threads"}

x-sets:
  items: &items [repo, commit, pull_request, issue, thread, channel, document, folder]
  anything: &anything [person, repo, commit, pull_request, issue, thread, channel, document, folder,
                       team, project, decision, system, action_item, customer]

relations:
  authored:
    origin: deterministic
    description: "Person created the item"
    from: [person]
    to: *items
  assigned_to:
    origin: both
    description: "Item or action item is owned by a person"
    from: [issue, pull_request, action_item]
    to: [person]
  reviewed:
    origin: deterministic
    description: "Person reviewed a PR or approved a doc"
    from: [person]
    to: [pull_request, document]
  participated_in:
    origin: deterministic
    description: "Person commented on or took part in the item without authoring it"
    from: [person]
    to: *items
  mentions:
    origin: both
    description: "Item mentions a person or entity"
    from: *items
    to: *anything
  references:
    origin: deterministic
    description: "Item links to another item"
    from: *items
    to: *items
  implements:
    origin: deterministic
    description: "PR or commit implements an issue"
    from: [pull_request, commit]
    to: [issue]
  closes:
    origin: deterministic
    description: "PR closes an issue"
    from: [pull_request]
    to: [issue]
  part_of:
    origin: both
    description: >-
      Item or entity belongs to a project or epic. An item's structural parent
      is its `container` field, never a part_of ref.
    from: [commit, pull_request, issue, thread, document, folder, decision, action_item, system]
    to: [project, issue, system]
  member_of:
    origin: both
    description: "Person belongs to a team"
    from: [person]
    to: [team]
  owns:
    origin: both
    description: "Person or team owns a system, project, repo or document"
    from: [person, team]
    to: [system, project, repo, document, folder, channel]
  works_on:
    origin: llm
    description: "Person is actively working on a project"
    from: [person, team]
    to: [project, system]
  decided_by:
    origin: llm
    description: "Decision was made by a person or team"
    from: [decision]
    to: [person, team]
  decided_in:
    origin: llm
    description: "Decision was made in this item"
    from: [decision]
    to: *items
  supersedes:
    origin: llm
    description: "A decision or document replaces an earlier one"
    from: [decision, document]
    to: [decision, document]
  depends_on:
    origin: both
    description: "Project, system or issue depends on another"
    from: [project, system, issue]
    to: [project, system, issue]
  blocks:
    origin: deterministic
    description: "Issue blocks another"
    from: [issue]
    to: [issue]

# Roles a person can hold on an item record's `people` list, and the relation
# each role means. Direction follows the relation's from/to: `assignee` and
# `mentioned` run item -> person, the rest person -> item.
person_roles:
  author:      authored
  reporter:    authored
  reviewer:    reviewed
  assignee:    assigned_to
  commenter:   participated_in
  participant: participated_in
  mentioned:   mentions
  owner:       owns
