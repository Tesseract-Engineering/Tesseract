[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tesseract-swarm"
version = "0.1.0"
description = "Batch pipelines that turn a company's sources into permission-aware records for the graph (docs/SWARM.md)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "jsonschema>=4,<5"]
swarm = ["pydantic>=2,<3", "pyyaml>=6,<7", "boto3>=1.34,<2", "detect-secrets>=1.5,<2", "httpx>=0.27,<1", "pyjwt[crypto]>=2.8,<3", "pypdf>=4,<7", "anthropic[bedrock]>=1.17,<2"]
# The graph builder (graph/): reads the bucket, writes Neo4j. Same pins as graph/requirements.txt.
graph = ["neo4j>=5,<6", "boto3>=1.34,<2"]

[tool.setuptools.packages.find]
include = ["swarm*", "graph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "s3: needs an S3-compatible bucket at S3_ENDPOINT (swarm/compose.yaml); skipped otherwise",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
