# The Slack app the customer creates for the swarm (api.slack.com/apps >
# Create New App > From an app manifest). Internal to their workspace, read
# only: it can list channels and users and read the history of channels its
# bot is invited to. No DMs, no events, no write scopes.
#
# After install, copy the Bot User OAuth Token (xoxb-...) into SLACK_BOT_TOKEN
# and invite the bot to each channel in scope (/invite @Tesseract Swarm).
display_information:
  name: Tesseract Swarm
  description: Reads the channels it is invited to, for the company's own knowledge graph. Read-only.
features:
  bot_user:
    display_name: Tesseract Swarm (read-only)
    always_online: false
oauth_config:
  scopes:
    bot:
      - channels:read        # list public channels and their members
      - channels:history     # read messages in public channels the bot is in
      - groups:read          # list private channels the bot is in, and their members
      - groups:history       # read messages in those private channels
      - users:read           # names, bot and deactivated flags
      - users:read.email     # emails, for ACL principals and identity matching
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
