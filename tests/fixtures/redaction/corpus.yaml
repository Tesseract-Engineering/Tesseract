# Planted-token corpus for the redact stage (docs/SWARM.md, Phase 1).
#
# Every secret is fake, and stored as fragments that tests join at load time,
# so no file in the repo holds a literal a secret scanner would flag. `type`
# is the detector name redaction must report.
#
# GitHub fixtures embed these by name: {{PLANTED:<name>}}.

positives:
  github_classic:      {type: GitHub Token,              parts: ["ghp", "_", "A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6Q7r8"]}
  github_oauth:        {type: GitHub Token,              parts: ["gho", "_", "Z9y8X7w6V5u4T3s2R1q0P9o8N7m6L5k4J3i2"]}
  github_app:          {type: GitHub Token,              parts: ["ghs", "_", "Q1w2E3r4T5y6U7i8O9p0A1s2D3f4G5h6J7k8"]}
  github_fine_grained: {type: GitHub Fine-Grained Token, parts: ["github", "_pat_", "11ABCDEFG0aBcDeFgHiJkL_", "mNoPqRsTuVwXyZ0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJ"]}
  slack_bot:           {type: Slack Token,               parts: ["xoxb", "-123456789012-1234567890123-", "abcdefghijklmnopqrstuvwx"]}
  slack_user:          {type: Slack Token,               parts: ["xoxp", "-123456789012-1234567890123-1234567890123-", "0123456789abcdef0123456789abcdef"]}
  slack_webhook:       {type: Slack Token,               parts: ["https://hooks.slack", ".com/services/", "T01ABCDEF/B02ABCDEF/abcdefghijklmnopqrstuvwx"]}
  aws_access_key:      {type: AWS Access Key,            parts: ["AKIA", "IOSFODNN7EXAMPLE"]}
  google_api_key:      {type: Google API Key,            parts: ["AIza", "SyA1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6Q"]}
  stripe_live:         {type: Stripe Access Key,         parts: ["sk", "_live_", "4eC39HqLyjWDarjtT1zdp7dc"]}
  jwt:                 {type: JSON Web Token,            parts: ["eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9", ".", "eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkFjbWUifQ", ".", "SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"]}
  private_key:         {type: Private Key,               parts: ["-----BEGIN RSA ", "PRIVATE KEY-----\nMIIEowIBAAKCAQEAtest\nabcdef\n-----END RSA ", "PRIVATE KEY-----"]}
  anthropic:           {type: Anthropic API Key,         parts: ["sk-ant", "-api03-", "abcdefghijklmnopqrstuvwxyz0123456789ABCD"]}
  openai:              {type: OpenAI Token,              parts: ["sk-proj", "-", "abcdefghijklmnopqrstuvwxyzABCDEFGHIJ0123456789abcd"]}
  npm:                 {type: NPM Token,                 parts: ["npm", "_", "abcdefghijklmnopqrstuvwxyz0123456789"]}
  basic_auth_url:      {type: Basic Auth Credentials,    parts: ["https://deploy:", "hunter2secret", "@registry.acme-sbx.dev/simple"]}

# Text that looks token-ish but must survive untouched.
negatives:
  - "Merged 3f9c2e1a7b4d5f60718293a4b5c6d7e8f9012345 into main"
  - "Request id 0b9c1f0e-6a7d-4d3a-9b0e-2f1c3d4e5f60 failed"
  - "See https://github.com/acme-sbx/api/pull/2 and https://docs.google.com/document/d/1DesignDocId0123/edit"
  - "Encoded as aGVsbG8gd29ybGQ= in the fixture"
  - "Bump actions/checkout from v3 to v4 (#41)"
  - "Fixes AUTH-12; see SHA-256 notes"
  - "Email sam@acme-sbx.dev about the token rotation"
