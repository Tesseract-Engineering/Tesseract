name: Release

# Publishes every image to GHCR (docs/RELEASING.md): `dev` from this-is-not-prod, `main` from main,
# X.Y.Z and X.Y from a vX.Y.Z tag, and a short-SHA tag always. Not a required check.
on:
  push:
    branches: [this-is-not-prod, main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write        # build provenance attestations
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The same names as the `images` job in ci.yml. A new component adds its image to both.
        image:
          - {name: swarm-github,   file: pipelines/github/Dockerfile}
          - {name: swarm-slack,    file: pipelines/slack/Dockerfile}
          - {name: swarm-drive,    file: pipelines/drive/Dockerfile}
          - {name: swarm-jira,     file: pipelines/jira/Dockerfile}
          - {name: swarm-identity, file: pipelines/identity/Dockerfile}
          - {name: swarm-sample,   file: pipelines/sample/Dockerfile}
          - {name: swarm-graph,    file: swarm/graph.Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/tesseract-engineering/${{ matrix.image.name }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/this-is-not-prod' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
          provenance: true
          sbom: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/tesseract-engineering/${{ matrix.image.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
