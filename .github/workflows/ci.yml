name: CI

on:
  push:
    branches: [this-is-not-prod, main]
  pull_request:
  workflow_dispatch:

# One run per branch or PR at a time; a new push cancels the old run of a PR, never of a branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check .

  test:
    name: test (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    services:
      # The swarm's dev bucket, for the s3-marked tests.
      storage:
        image: rustfs/rustfs:1.0.1
        env:
          RUSTFS_ACCESS_KEY: ci-access
          RUSTFS_SECRET_KEY: ci-secret-key
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -sf http://127.0.0.1:9000/health"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      S3_ENDPOINT: http://localhost:9000
      AWS_ACCESS_KEY_ID: ci-access
      AWS_SECRET_ACCESS_KEY: ci-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev,swarm,graph]'
      - run: pytest
