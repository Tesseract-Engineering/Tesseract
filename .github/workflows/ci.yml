name: CI

on:
  push:
    branches: [this-is-not-prod, main]
  pull_request:
  workflow_dispatch:

# One run per branch or PR at a time; a new push cancels the old run of a PR, never of a branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check .

  test:
    name: test (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    services:
      # The swarm's dev bucket, for the s3-marked tests.
      storage:
        image: rustfs/rustfs:1.0.1
        env:
          RUSTFS_ACCESS_KEY: ci-access
          RUSTFS_SECRET_KEY: ci-secret-key
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -sf http://127.0.0.1:9000/health"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      S3_ENDPOINT: http://localhost:9000
      AWS_ACCESS_KEY_ID: ci-access
      AWS_SECRET_ACCESS_KEY: ci-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev,swarm,graph]'
      - run: pytest

  neo4j:
    name: neo4j
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # The same image as swarm/compose.yaml. The password guards a throwaway database and is not a secret.
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/ci-only-password
        ports: ["7687:7687"]
        options: >-
          --health-cmd "wget -qO /dev/null http://127.0.0.1:7474 || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      NEO4J_URI: neo4j://localhost:7687
      NEO4J_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev,swarm,graph]'
      - run: pytest -m neo4j -v

  images:
    name: images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # `docker buildx build --cache-to type=gha` from a shell step needs the runtime token in the environment.
      - uses: crazy-max/ghaction-github-runtime@v3
      - name: Validate the compose stack
        run: |
          docker compose -f swarm/compose.yaml config -q
          # The released-images override (C7): all eight job services run a GHCR image and build nothing.
          docker compose -f swarm/compose.yaml -f swarm/compose.images.yaml --profile jobs config --format json \
            | python3 .github/scripts/check_images_override.py
      # One job, one loop: branch protection requires a single `images` check however many images there are.
      # A new component adds its image here (forge plan F9: "forge:forge/Dockerfile", and -f forge/compose.yaml
      # in the validation step above) and to release.yml.
      - name: Build every image
        run: |
          set -euo pipefail
          for spec in \
            "swarm-github:pipelines/github/Dockerfile" \
            "swarm-slack:pipelines/slack/Dockerfile" \
            "swarm-drive:pipelines/drive/Dockerfile" \
            "swarm-jira:pipelines/jira/Dockerfile" \
            "swarm-identity:pipelines/identity/Dockerfile" \
            "swarm-sample:pipelines/sample/Dockerfile" \
            "swarm-graph:swarm/graph.Dockerfile"; do
            name="${spec%%:*}"; file="${spec#*:}"
            echo "::group::$name"
            docker buildx build --file "$file" --tag "$name:ci" \
              --cache-from "type=gha,scope=$name" --cache-to "type=gha,mode=max,scope=$name" .
            echo "::endgroup::"
          done
